name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # No Rust/Emscripten toolchain: the committed WASM artifacts in
      # src/engine/ are what ships (ADR-064 Phase 1, ADR-053 §11).
      # Regenerating them is a local, deliberate act via `pnpm build:full`.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      # Built in the STUB LANE (ADR-117). GitHub Pages is a static host with no
      # BFF and no core API behind it, so an ordinary build ships a grasp panel
      # whose Run button can only ever fail — the feature is unreachable for
      # exactly the people a public URL is for. The stub answers locally so the
      # walkthrough is reviewable end to end, and every stubbed screen carries a
      # badge saying the numbers are fabricated (原則 #11), so a demo can never
      # be mistaken for a measurement in docs/dogfooding/.
      #
      # The unit gate proves the same stub stays OUT of `pnpm build` (ci.yml).
      - name: Build (grasp stub lane — static host has no backend)
        run: pnpm build:stub

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
