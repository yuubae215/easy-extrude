<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{題材}} — ワイヤーフレーム v{{N}}</title>
<!--
  注釈付きインタラクティブワイヤーフレーム雛形
  使い方:
  - .frame の grid-template-* を題材のゾーニングに合わせて書き換える
  - 各ゾーンに data-note="番号" と <span class="badge">番号</span> を付ける
  - notes オブジェクトに {番号: {title, body}} で設計根拠を書く(「なぜそこか」+原則名+業界実例)
  - 代表状態(選択中など)は .selected / --sel 色で表現し、ヘッダーに明記
  - モード系(テンプレート編集等)はアクセント色を差し替える(例: 紫 #7c3aed)
  - ウィザード用のステップUI部品は末尾のコメントブロック参照
-->
<style>
  :root{
    --paper:#f5f5f4;   /* 背景紙 */
    --box:#ffffff;     /* フレーム地 */
    --line:#9ca3af;    /* 薄い線 */
    --line-dark:#4b5563;/* 濃い線 */
    --ink:#374151;     /* 文字 */
    --muted:#9ca3af;   /* 補助文字 */
    --note:#2563eb;    /* アクセント(注釈・選択)。モードに応じ差替可 */
    --note-bg:#eff6ff;
    --sel:#dbeafe;     /* 選択ハイライト */
    --ax-x:#b91c1c;--ax-y:#15803d;--ax-z:#1d4ed8; /* 座標軸(使う場合) */
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
    background:var(--paper);color:var(--ink);padding:16px;}
  header{max-width:1000px;margin:0 auto 12px;}
  header h1{font-size:15px;font-weight:700;}
  header p{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.7;}
  .hint{display:inline-block;margin-top:8px;font-size:11px;color:var(--note);
    background:var(--note-bg);border:1px solid #bfdbfe;border-radius:4px;padding:4px 8px;}

  /* ====== フレーム(ゾーニングに合わせて書き換える) ====== */
  .frame{
    max-width:1000px;margin:0 auto;background:var(--box);
    border:2px solid var(--line-dark);border-radius:6px;overflow:hidden;
    display:grid;position:relative;font-size:11px;
    /* 例: メニュー/左/中央/右/下 の5ゾーン構成 */
    grid-template-rows:36px 1fr 72px;
    grid-template-columns:180px 1fr 200px;
    grid-template-areas:
      "menu menu menu"
      "left main right"
      "time time time";
    height:560px;
  }
  @media (max-width:640px){
    .frame{grid-template-columns:120px 1fr 150px;height:500px;font-size:10px;}
  }

  /* ====== ゾーン共通(タップで注釈) ====== */
  .zone{position:relative;border:1px dashed var(--line);cursor:pointer;transition:background .15s;}
  .zone:hover,.zone.active{background:#f0f7ff;}
  .zone.active{outline:2px solid var(--note);outline-offset:-2px;}
  .zone-label{position:absolute;top:4px;left:6px;font-size:9px;font-weight:700;
    color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
  .badge{position:absolute;top:3px;right:5px;width:16px;height:16px;border-radius:50%;
    background:var(--note);color:#fff;font-size:10px;font-weight:700;
    display:flex;align-items:center;justify-content:center;}

  /* ====== 部品 ====== */
  .wf-btn{border:1px solid var(--line-dark);border-radius:4px;background:#fff;
    font-size:10px;color:var(--ink);padding:3px 8px;white-space:nowrap;cursor:pointer;}
  .wf-icon{width:26px;height:26px;border:1px solid var(--line-dark);border-radius:4px;
    background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;}
  /* 描画領域(斜線ハッチ) */
  .canvas-hatch{background:repeating-linear-gradient(45deg,transparent,transparent 14px,
    #e5e7eb 14px,#e5e7eb 15px);}
  /* 入力可フィールド(枠+内側の影=アフォーダンス) */
  .field{border:1px solid var(--line-dark);border-radius:3px;background:#fff;
    padding:2px 6px;font-weight:600;box-shadow:inset 0 1px 2px rgba(0,0,0,.07);}
  /* ハイブリッドウィジェット(スライダー内蔵数値) */
  .hyfield{height:15px;border:1px solid var(--line-dark);border-radius:3px;background:#fff;
    position:relative;overflow:hidden;display:flex;align-items:center;justify-content:flex-end;
    padding:0 4px;font-weight:600;box-shadow:inset 0 1px 2px rgba(0,0,0,.07);}
  .hyfield .fill{position:absolute;left:0;top:0;bottom:0;background:#e5e7eb;}
  .hyfield span{position:relative;}
  /* 選択ハイライト・ゴースト(ドラフト) */
  .selected{background:var(--sel);border:1px solid var(--note);font-weight:700;}
  .ghost{border-style:dashed !important;opacity:.55;}

  /* ====== 注釈パネル ====== */
  .note-panel{max-width:1000px;margin:12px auto 0;background:var(--note-bg);
    border:1px solid #bfdbfe;border-radius:6px;padding:12px 14px;min-height:96px;}
  .note-panel .np-title{font-size:12px;font-weight:700;color:var(--note);
    margin-bottom:6px;display:flex;align-items:center;gap:6px;}
  .note-panel .np-num{width:18px;height:18px;border-radius:50%;background:var(--note);
    color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;
    flex-shrink:0;}
  .note-panel p{font-size:12px;line-height:1.8;}
  .note-panel .placeholder{color:var(--muted);font-size:12px;line-height:1.8;}
</style>
</head>
<body>

<header>
  <h1>{{題材}} — ワイヤーフレーム v{{N}}</h1>
  <p>{{vN-1からの変更点を必ず書く。v1なら忠実度と対象幅、描いている代表状態}}</p>
  <span class="hint">💡 各エリアをタップすると、その配置の設計根拠が下に表示されます</span>
</header>

<div class="frame">
  <div class="zone" style="grid-area:menu;" data-note="1">
    <span class="zone-label">メニュー</span><span class="badge">1</span>
    <!-- 中身 -->
  </div>
  <div class="zone" style="grid-area:left;" data-note="2">
    <span class="zone-label">{{左ゾーン名}}</span><span class="badge">2</span>
  </div>
  <div class="zone canvas-hatch" style="grid-area:main;" data-note="3">
    <span class="zone-label">{{主役ゾーン名}}</span><span class="badge">3</span>
  </div>
  <div class="zone" style="grid-area:right;" data-note="4">
    <span class="zone-label">{{右ゾーン名}}</span><span class="badge">4</span>
  </div>
  <div class="zone" style="grid-area:time;" data-note="5">
    <span class="zone-label">{{下ゾーン名}}</span><span class="badge">5</span>
  </div>
</div>

<div class="note-panel" id="notePanel">
  <p class="placeholder">↑ エリアをタップしてください。「なぜそこに置くのか」の設計根拠が表示されます。</p>
</div>

<script>
// 注釈: 「何があるか」ではなく「なぜそこか」。原則名+業界実例を含めること。
const notes = {
  "1": { title: "{{ゾーン名}}:{{一言の責務}}", body: "{{配置の根拠。原則名と実例}}" },
  "2": { title: "", body: "" },
  "3": { title: "", body: "" },
  "4": { title: "", body: "" },
  "5": { title: "", body: "" }
};
const panel = document.getElementById("notePanel");
let active = null;
document.querySelectorAll("[data-note]").forEach(el => {
  el.addEventListener("click", e => {
    e.stopPropagation();
    const id = el.dataset.note;
    if (!id || !notes[id]) return;
    if (active) active.classList.remove("active");
    if (el.classList.contains("zone")) { el.classList.add("active"); active = el; }
    panel.innerHTML =
      '<div class="np-title"><span class="np-num">' + id + '</span>' + notes[id].title + '</div>' +
      '<p>' + notes[id].body + '</p>';
  });
});
</script>

<!--
====== ウィザード用部品(必要時にコピーして使う) ======
構成: ステップインジケータ + pane切替 + ステップ別注釈 + 次へ/戻る。
到達済みステップのみジャンプ可、最終ステップのボタンは「適用 ✓」に変える。
確定済み文脈の常時表示(.lockcap)とキャンセル無害性の注記を忘れない。

<div class="steps">
  <span class="sdot cur" data-s="0">1</span> ... 
</div>
<div class="pane cur" data-p="0"> ... </div>

const stepNotes = ["各ステップの設計根拠", ...];
let cur = 0;
function render(){
  panes.forEach(p=>p.classList.toggle("cur",+p.dataset.p===cur));
  dots.forEach(d=>{const i=+d.dataset.s;
    d.classList.toggle("cur",i===cur);d.classList.toggle("done",i<cur);});
  noteBody.textContent=stepNotes[cur];
  nextBtn.textContent=cur===LAST?"適用 ✓":"次へ →";
}
-->
</body>
</html>
